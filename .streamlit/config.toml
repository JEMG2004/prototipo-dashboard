# Colores del tablero: los mismos de los gráficos, en modo claro y oscuro.
# Streamlit sigue el modo del sistema; se cambia en el menú ⋮ > Settings.

[theme]
font = "system-ui, -apple-system, 'Segoe UI', sans-serif"
baseRadius = "0.5rem"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#383835"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
