# fly.toml app configuration file generated for prototipo-dashboard on 2026-11-14T22:07:02Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'prototipo-dashboard'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CARPETA_GENERADOS = '/data/generados'

[[mounts]]
  source = 'datos'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
