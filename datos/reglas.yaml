    forma: categoria
    efecto: {"No": 0.4}
    fuerza: moderada
    descripcion: "Sin respaldo de compañeros, es más probable desertar."
    fuente: "Supuesto. Es una de las condiciones de riesgo de Rosero y Velasco (2026)."

  - id: D09
    tipo: desercion
