# Corre las tres pruebas del prototipo en cada cambio que llega a GitHub (pestaña Actions del repositorio).
# Render espera a que pasen antes de publicar (autoDeployTrigger: checksPass en render.yaml).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Instalar los paquetes (versiones fijas de requirements.txt)
        run: pip install -r requirements.txt
      - name: Prueba rápida (generador, modelo, escenarios y diagnóstico)
        run: python -m pruebas.prueba_rapida
      - name: Clave de acceso
        run: python -m pruebas.prueba_acceso
      - name: Disco persistente vacío (Fly.io o Render con disco)
        run: python -m pruebas.prueba_semilla
      - name: Todas las pantallas
        run: python -m pruebas.prueba_app
